name: build
on:
  workflow_dispatch:
    inputs:
      version:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: build
      run: |
        git submodule update --init --recursive
        bazel build -c opt //tflite/java:tensorflowlitelib_stable --linkopt=-Wl,-z,noexecstack
        chmod +w bazel-bin/tflite/java/*.jar
        zip -0uj bazel-bin/tflite/java/*_stable.jar bazel-bin/tflite/java/*.so
        ls -l bazel-bin/tflite/java/*.so
